name: llm-profiling
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - transformers
      - accelerate
      - bitsandbytes
      - kernels
      - sentencepiece
      - pymupdf                    # PDF text extraction
      - python-docx                # DOCX text extraction
      - langchain-text-splitters   # chunking
      - sentence-transformers      # embeddings for RAG retrieval
      - faiss-cpu                  # vector index for RAG retrieval
      - pandas
      - bert_score                 # short-answer + open-ended metric (BERTScore, uses BETO)
      - nltk                       # open-ended metric (METEOR)